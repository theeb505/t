<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسلسل Lucky - الحلقة 1 | مشغل بدون إعلانات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        .player-container {
            width: 100%;
            max-width: 960px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* أبعاد 16:9 */
            height: 0;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .server-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: #0f172a;
            justify-content: center;
        }
        .server-btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .server-btn:hover {
            background: #475569;
        }
        .server-btn.active {
            background: #0284c7;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.5);
        }
        .info-bar {
            padding: 15px;
            font-size: 0.9rem;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #334155;
        }
        .ad-status {
            color: #22c55e;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>مسلسل Lucky - الحلقة 1 (مترجمة)</h1>
        <p>مشغل مخصص مع <span class="ad-status">🛡️ مانع الإعلانات المدمج نشط</span></p>
    </div>

    <div class="player-container">
        <!-- مشغل الفيديو الرئيسي -->
        <div class="video-wrapper">
            <iframe id="main-player" src="https://mp4.okhd.site/embed-vm6in0p12qt9.html" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        </div>

        <!-- أزرار التغيير بين السيرفرات -->
        <div class="server-list">
            <button class="server-btn active" onclick="changeServer(this, 'https://mp4.okhd.site/embed-vm6in0p12qt9.html')">Mp4</button>
            <button class="server-btn" onclick="changeServer(this, 'https://rty1.film77.xyz/embed-rdpchva9ubqp.html')">Rty1</button>
            <button class="server-btn" onclick="changeServer(this, 'https://vidoba.org/embed-ny3gm3g26e2k.html')">Vidoba</button>
            <button class="server-btn" onclick="changeServer(this, 'https://mp4plus.org/embed-lp9u5c9v8ku9.html')">Mp4plus</button>
            <button class="server-btn" onclick="changeServer(this, 'https://anafast.org/embed-mcxv0v42jxmv.html')">Anafast</button>
            <button class="server-btn" onclick="changeServer(this, 'https://vidspeed.org/embed-useub99jyope.html')">Vidspeed</button>
            <button class="server-btn" onclick="changeServer(this, 'https://abstream.to/e/va6zjkyufi9g')">Abstream</button>
            <button class="server-btn" onclick="changeServer(this, 'https://mixdrop.top/e/jd981z4mh788k44')">Mixdrop</button>
            <button class="server-btn" onclick="changeServer(this, 'https://dsvplay.com/e/p8grbth4p65w')">Dsvplay</button>
            <button class="server-btn" onclick="changeServer(this, 'https://voe.sx/e/6swgf1fzxy6h')">Voe</button>
        </div>

        <div class="info-bar">
            💡 اضغط على اسم أي سيرفر أعلاه للتحويل إليه مباشرة بدون إعلانات منبثقة.
        </div>
    </div>

    <script>
        // دالة التبديل بين السيرفرات
        function changeServer(btnElement, serverUrl) {
            // 1. تغيير رابط السيرفر داخل المشغل
            document.getElementById('main-player').src = serverUrl;

            // 2. تحديث الشكل البصري للأزرار (تمييز الزر النشط)
            const buttons = document.querySelectorAll('.server-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        // حظر فتح النوافذ المنبثقة الإعلانية تلقائياً
        window.open = function() {
            return null;
        };
    </script>
</body>
</html>
